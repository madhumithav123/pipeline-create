name: Node.js CI/CD

on:
  push:
    branches:
       -main
    

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build --if-present

      - name: Restart application
        run: |
          pm2 delete my-node-app || true
          pm2 start npm --name "my-node-app" -- start
          pm2 save

